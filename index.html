<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#eef2f6; --text:#14212e; --muted:#5b6b7b; --line:#dde3ea;
  --brand:#0e3a5c; --brand-ink:#ffffff; --accent:#1a8f86; --accent-soft:#e1f3f1; --member:#2e7d32; --member-soft:#e6f4e7;
  --long:#2457a6; --short:#1a8f86; --hook:#b7791f; --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141c; --surface:#131e29; --surface2:#1a2734; --text:#e6edf3; --muted:#93a4b5; --line:#24323f;
  --brand:#0a2a43; --brand-ink:#e6edf3; --accent:#3cc3b7; --accent-soft:#143532; --member:#6cc070; --member-soft:#18301a;
  --long:#7ea7ec; --short:#3cc3b7; --hook:#e0a64b; --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
header{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-weight:700;text-decoration:none;white-space:nowrap;font-size:17px;letter-spacing:.02em}
.logo small{font-weight:400;opacity:.75;margin-left:6px;font-size:13px}
.searchbox{flex:1;display:flex;max-width:560px;margin-left:auto;min-width:0}
.searchbox input{flex:1;min-width:0;border:0;border-radius:10px 0 0 10px;padding:9px 14px;font:inherit;font-size:15px;background:#fff;color:#14212e}
.searchbox button{border:0;border-radius:0 10px 10px 0;padding:0 16px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
header.home-mode .searchbox{display:none}
/* hero */
.hero{background:var(--brand);color:var(--brand-ink);padding:36px 0 44px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px)}
.hero p{margin:0 0 20px;opacity:.8}
.hero .searchbox{max-width:680px;margin:0}
.hero .searchbox input{padding:13px 16px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;text-decoration:none;background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.18)}
.chip:hover{background:rgba(255,255,255,.22)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;text-decoration:none;background:var(--accent-soft);color:var(--accent);margin:0 6px 6px 0}
.tag.kw{background:var(--surface2);color:var(--muted)}
.tag:hover{filter:brightness(.95)}
/* sections */
section{margin:32px 0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0;font-size:20px}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
.sec-head a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
.badge.m{background:var(--member);color:#fff}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted)}
.hits{font-size:13px;color:var(--muted);margin:0;padding-left:16px}
.hits li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* search page */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 6px}
.toolbar h1{font-size:20px;margin:0 auto 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.note{color:var(--muted);font-size:14px;margin:4px 0 16px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
/* watch page */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:24px}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.watch h1{font-size:21px;margin:14px 0 4px;line-height:1.45}
.memberbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--member-soft);color:var(--member);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.btn{display:inline-block;padding:7px 14px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:500}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.m{background:var(--member)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
.box h2{font-size:16px;margin:0 0 10px}
.segs{list-style:none;margin:0;padding:0}
.segs li{padding:10px 0;border-top:1px solid var(--line)}
.segs li:first-child{border-top:0}
.segs li.sub{padding-left:22px}
.segs .st{font-weight:500}
.subs{margin:6px 0 0;padding-left:20px;font-size:14px}.subs li{padding:2px 0;border:0}
.segs .ss{color:var(--muted);font-size:14px;margin-top:2px}
.kind{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;margin-right:6px;border:1px solid currentColor;vertical-align:1px}
.kind.長精華{color:var(--long)} .kind.短精華{color:var(--short)} .kind.精精華{color:var(--hook)} .kind.一般{color:var(--muted)}
.side h2{font-size:16px;margin:0 0 12px}
.mini{display:flex;gap:10px;text-decoration:none;margin-bottom:14px}
.mini .thumb{width:150px;flex:none;border-radius:8px;overflow:hidden}
.mini h3{font-size:14px;margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:12px;color:var(--accent);margin-top:2px}
@media (max-width:900px){.watch{grid-template-columns:1fr}}
@media (max-width:560px){.logo small{display:none} header .wrap{gap:10px} header .searchbox button{padding:0 12px} .mini .thumb{width:128px}}
/* footer */
footer{background:var(--brand);color:var(--brand-ink);margin-top:56px;padding:32px 0 24px}
.fgrid{display:flex;flex-wrap:wrap;gap:32px}
.fgrid h4{margin:0 0 10px;font-size:14px;opacity:.75;font-weight:500}
.fgrid .links{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);text-decoration:none;font-size:14px}
.fbtn:hover{background:rgba(255,255,255,.12)}
.fbtn.join{background:var(--accent);border-color:var(--accent)}
.fine{margin-top:22px;font-size:12.5px;opacity:.6}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
</style>

<header id="top"><div class="wrap">
  <a class="logo" href="#/">🐋 財鯨動向<small>直播索引</small></a>
  <form class="searchbox" onsubmit="return go(this)"><input name="q" type="search" placeholder="搜尋主題、個股、關鍵字" aria-label="搜尋"><button>搜尋</button></form>
</div></header>
<main id="app"><div class="loading">載入中…</div></main>
<footer><div class="wrap">
  <div class="fgrid">
    <div><h4>追蹤財鯨動向</h4><div class="links">

    </div></div>
    <div><h4>主持人</h4><div class="links">
      <a class="fbtn" href="https://www.instagram.com/j.perfectionist.j/" target="_blank" rel="noopener">◎ JohnJohn</a>
      <a class="fbtn" href="https://www.instagram.com/maggy_hwang.0324/" target="_blank" rel="noopener">◎ Maggy</a>

    </div></div>
  </div>
  <div class="fine" id="updated">每週四晚上 8 點直播・本站內容僅供參考，不構成投資建議・本站使用 Google Analytics 統計瀏覽情形</div>
</div></footer>

<script>
let D, ALIAS = [], IDF = {}, BYID = {};
const W = {"長精華": 1.5, "精精華": 1.3, "短精華": 1.2, "一般": 1};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const fmtViews = n => n == null ? "" : (n >= 10000 ? (n / 10000).toFixed(1) + " 萬" : n.toLocaleString()) + " 次觀看";
const fmtDate = d => d.replaceAll("-", "/");

/* ---------- 數據追蹤（GA4） ---------- */
function track(name, params) { try { if (window.gtag) gtag("event", name, params || {}); } catch (e) {} }
let curPage = "home", nextSource = "", lastSearch = null;
function trackPage(type, path, title) {
  curPage = type;
  const base = location.origin + location.pathname.replace(/\/$/, "");
  track("page_view", { page_location: base + path, page_title: title, page_type: type });
}
// 點擊追蹤：標籤、主軸、熱門關鍵字、影片卡片、行動呼籲按鈕
document.addEventListener("click", e => {
  const a = e.target.closest("a, button");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (a.classList.contains("tag")) track("tag_click", { tag_name: a.textContent.trim(), tag_type: a.classList.contains("kw") ? "關鍵字" : "主題標籤", page_type: curPage });
  else if (a.classList.contains("chip")) track("tag_click", { tag_name: a.textContent.trim(), tag_type: "熱門關鍵字", page_type: curPage });
  else if (href.includes("theme=")) { const id = new URLSearchParams(href.split("?")[1]).get("theme"); const th = D.themes.find(t => t.id === id); track("theme_click", { theme_name: th ? th.name : id }); }
  if (href.startsWith("#/watch/")) {
    const list = a.closest(".grid, aside, .box");
    const items = list ? [...list.querySelectorAll('a[href^="#/watch/"]')] : [];
    nextSource = a.closest("aside") ? "相關影片" : a.closest(".box") ? "同場另一段" : curPage === "search" ? "搜尋結果" : "首頁";
    if (a.closest("aside")) track("related_click", { video_id: href.slice(8), position: items.indexOf(a) + 1 });
  }
  if (/^https?:/.test(href)) {
    let cta = "其他外部連結";
    if (href.includes("/join")) cta = "加入會員";
    else if (href.includes("instagram.com/real.goodwhale")) cta = "IG 財鯨動向";
    else if (href.includes("instagram.com/j.perfectionist")) cta = "IG JohnJohn";
    else if (href.includes("instagram.com/maggy")) cta = "IG Maggy";
    else if (href.includes("instagram.com/adgar")) cta = "IG Adgar";
    else if (href.includes("watch?v=")) cta = a.textContent.includes("觀看") ? "到 YouTube 觀看（會員）" : "在 YouTube 開啟";
    else if (href.includes("youtube.com/@")) cta = "YouTube 頻道";
    const v = curPage === "watch" ? BYID[decodeURIComponent(location.hash.slice(8))] : null;
    track("cta_click", { cta_name: cta, page_type: curPage, video_id: v ? v.id : "", video_type: v ? (v.member ? "會員" : "公開") : "" });
  }
});
// 內嵌影片播放追蹤（YouTube IFrame API）
let ytReady = null, ytTimer = null;
function loadYT() {
  if (!ytReady) ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  });
  return ytReady;
}
function trackPlayer(v) {
  clearInterval(ytTimer);
  loadYT().then(() => {
    const el = document.getElementById("ytplayer");
    if (!el || el.dataset.vid !== v.id) return;
    const base = { video_id: v.id, video_title: v.title, video_type: v.member ? "會員" : "公開" };
    let started = false, sent = new Set();
    const player = new YT.Player("ytplayer", { events: { onStateChange: ev => {
      if (ev.data === YT.PlayerState.PLAYING && !started) { started = true; track("yt_play", base); }
      if (ev.data === YT.PlayerState.ENDED && !sent.has(100)) { sent.add(100); track("yt_complete", base); }
    } } });
    ytTimer = setInterval(() => {
      try {
        const d = player.getDuration(), t = player.getCurrentTime();
        if (!d) return;
        for (const p of [25, 50, 75]) if (t / d * 100 >= p && !sent.has(p)) { sent.add(p); track("yt_progress", { ...base, percent: p }); }
      } catch (e) {}
    }, 5000);
  });
}

function go(form) {
  const q = form.q.value.trim();
  if (q) location.hash = "#/search?q=" + encodeURIComponent(q);
  return false;
}

async function init() {
  D = await fetch("data.json").then(r => r.json());
  D.videos.forEach(v => BYID[v.id] = v);
  for (const [name, al] of Object.entries(D.aliases)) ALIAS.push([name, [name, ...al].map(x => x.toLowerCase())]);
  const df = {};
  D.videos.forEach(v => new Set([...v.keywords, ...v.topics]).forEach(k => df[k] = (df[k] || 0) + 1));
  const n = D.videos.filter(v => v.indexed).length;
  for (const k in df) IDF[k] = Math.log(1 + n / df[k]);
  $("#updated").textContent = `資料更新：${D.updated}・每週四晚上 8 點直播・本站內容僅供參考，不構成投資建議・本站使用 Google Analytics 統計瀏覽情形`;
  window.addEventListener("hashchange", route);
  route();
}

/* ---------- 搜尋 ---------- */
function expand(term) {
  const t = term.toLowerCase(), set = new Set([term]);
  for (const [name, list] of ALIAS)
    if (list.some(a => a === t || (t.length >= 2 && a.includes(t)) || (a.length >= 2 && t.includes(a) && a.length >= t.length - 1))) set.add(name);
  return set;
}
function scoreTerm(v, raw, names) {
  const r = raw.toLowerCase(); let s = 0; const hits = [];
  if (v.title.toLowerCase().includes(r)) s += 8;
  if (v.summary.toLowerCase().includes(r)) s += 2;
  for (const g of v.segs) {
    let gs = 0;
    if (g.kw.some(k => names.has(k))) gs += 6;
    if (g.tp.some(k => names.has(k) || k.includes(raw))) gs += 4;
    if (g.t.toLowerCase().includes(r)) gs += 4;
    if (g.s.toLowerCase().includes(r)) gs += 1.5;
    if (gs) { s += gs * W[g.k]; hits.push(g.t); }
  }
  return { s, hits };
}
// 把「AI泡沫」這種沒空格的詞拆成 AI、泡沫；中文長詞再拆成兩字一組
function tokenize(raw) {
  const out = [];
  for (const m of raw.match(/[A-Za-z0-9.&+-]+|[^A-Za-z0-9.&+\-\s]+/g) || []) {
    if (/^[A-Za-z0-9.&+-]+$/.test(m) || m.length <= 2) out.push(m);
    else for (let i = 0; i < m.length - 1; i++) out.push(m.slice(i, i + 2));
  }
  return [...new Set(out)];
}
function scoreVideo(v, terms) {
  let total = 0; const hits = new Set();
  for (const { raw, names, toks } of terms) {
    let { s, hits: h } = scoreTerm(v, raw, names);
    if (!s && toks.length > 1) {
      let got = 0, sum = 0; const hh = [];
      for (const t of toks) { const r = scoreTerm(v, t, expand(t)); if (r.s) { got++; sum += r.s; hh.push(...r.hits); } }
      if (got >= Math.ceil(toks.length / 2)) { s = sum * (got / toks.length) ** 2 * 0.8; h = hh; }
    }
    if (!s) return null;
    h.forEach(x => hits.add(x)); total += s;
  }
  return { v, score: total, hits: [...hits] };
}
function search(q) {
  const terms = q.split(/\s+/).filter(Boolean).map(raw => ({ raw, names: expand(raw), toks: tokenize(raw) }));
  return D.videos.map(v => scoreVideo(v, terms)).filter(Boolean);
}
function themeScore(v, th) {
  return v.segs.reduce((s, g) => s + (g.tp.some(t => th.topics.includes(t)) ? W[g.k] * (g.k === "一般" ? 1 : 2) : 0), 0);
}

/* ---------- 元件 ---------- */
function card(v, hits) {
  const tags = v.topics.slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const hl = hits && hits.length ? `<ul class="hits">${hits.slice(0, 3).map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : "";
  return `<a class="card" href="#/watch/${v.id}">
    <div class="thumb"><img loading="lazy" src="${thumb(v.id)}" alt=""><span class="badge ${v.member ? "m" : ""}">${v.member ? "會員" : "公開"}</span></div>
    <div class="body"><h3>${esc(v.title)}</h3>
      <div class="meta">${fmtDate(v.date)}${v.views != null ? "・" + fmtViews(v.views) : ""}</div>
      ${hl}<div>${tags}</div></div></a>`;
}
function mini(v, why) {
  return `<a class="mini" href="#/watch/${v.id}"><div class="thumb"><img loading="lazy" src="${thumb(v.id)}" alt=""><span class="badge ${v.member ? "m" : ""}">${v.member ? "會員" : "公開"}</span></div>
    <div><h3>${esc(v.title)}</h3><div class="meta">${fmtDate(v.date)}</div>${why ? `<div class="why">${esc(why)}</div>` : ""}</div></a>`;
}
function topKeywords(n) {
  const c = {};
  D.videos.forEach(v => v.segs.forEach(g => g.kw.forEach(k => c[k] = (c[k] || 0) + W[g.k])));
  return Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, n);
}

/* ---------- 頁面 ---------- */
function home() {
  $("#top").classList.add("home-mode");
  lastSearch = null;
  trackPage("home", "/", "首頁");
  const latest = D.videos.slice(0, 4);
  let html = `<div class="hero"><div class="wrap">
    <h1>想找哪一集？</h1><p>輸入主題、個股或關鍵字，找出財鯨動向直播講過的內容</p>
    <form class="searchbox" onsubmit="return go(this)"><input name="q" type="search" placeholder="例如：台積電、CPO、美債、資產配置" aria-label="搜尋"><button>搜尋</button></form>
    <div class="chips">${topKeywords(12).map(k => `<a class="chip" href="#/search?q=${encodeURIComponent(k)}">${esc(k)}</a>`).join("")}</div>
  </div></div><div class="wrap">
  <section><div class="sec-head"><h2>最新直播</h2><a href="#/search?sort=new">看全部 →</a></div><div class="grid">${latest.map(v => card(v)).join("")}</div></section>`;
  for (const th of D.themes) {
    const list = D.videos.map(v => ({ v, s: themeScore(v, th) })).filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || b.v.date.localeCompare(a.v.date)).slice(0, 4);
    if (!list.length) continue;
    html += `<section><div class="sec-head"><h2>${esc(th.name)}</h2><p>${esc(th.desc)}</p><a href="#/search?theme=${th.id}">看全部 →</a></div>
      <div class="grid">${list.map(x => card(x.v)).join("")}</div></section>`;
  }
  $("#app").innerHTML = html + "</div>";
}

function results(params) {
  $("#top").classList.remove("home-mode");
  const q = params.get("q") || "", theme = params.get("theme") || "", type = params.get("type") || "all";
  let sort = params.get("sort") || (q ? "rel" : "new");
  document.querySelector("header input").value = q;
  let list = q ? search(q) : D.videos.map(v => ({ v, score: 0, hits: [] }));
  const th = D.themes.find(t => t.id === theme);
  if (th) list = list.filter(x => x.v.topics.some(t => th.topics.includes(t)));
  const state = { q, theme, type, sort };
  if (q && (!lastSearch || lastSearch.q !== q)) {
    track("search", { query: q, result_count: list.length });
    if (!list.length) track("search_no_result", { query: q });
  } else if (lastSearch && lastSearch.q === q) {
    for (const k of ["sort", "type", "theme"]) if (lastSearch[k] !== state[k]) track("filter_change", { filter_name: k, filter_value: state[k] || "全部", query: q });
  }
  lastSearch = state;
  trackPage("search", "/search", q ? "搜尋：" + q : th ? "主軸：" + th.name : "全部直播");
  if (type !== "all") list = list.filter(x => x.v.member === (type === "member"));
  const by = {
    rel: (a, b) => b.score - a.score || b.v.date.localeCompare(a.v.date),
    new: (a, b) => b.v.date.localeCompare(a.v.date) || a.v.member - b.v.member,
    old: (a, b) => a.v.date.localeCompare(b.v.date) || a.v.member - b.v.member,
    hot: (a, b) => (b.v.views ?? -1) - (a.v.views ?? -1) || b.v.date.localeCompare(a.v.date),
  };
  list.sort(by[sort] || by.new);
  const set = (k, val) => { const p = new URLSearchParams(params); val ? p.set(k, val) : p.delete(k); return "#/search?" + p.toString().replace(/'/g, "%27"); };
  const sorts = [["rel", "最相關"], ["new", "最新"], ["old", "最舊"], ["hot", "熱門"]].filter(s => q || s[0] !== "rel");
  const heading = q ? `「${esc(q)}」的搜尋結果` : th ? esc(th.name) : "全部直播";
  $("#app").innerHTML = `<div class="wrap">
    <div class="toolbar"><h1>${heading}</h1>
      <div class="seg">${sorts.map(([k, l]) => `<button class="${sort === k ? "on" : ""}" onclick="location.hash='${set("sort", k)}'">${l}</button>`).join("")}</div>
      <div class="seg">${[["all", "全部"], ["public", "公開"], ["member", "會員"]].map(([k, l]) => `<button class="${type === k ? "on" : ""}" onclick="location.hash='${set("type", k === "all" ? "" : k)}'">${l}</button>`).join("")}</div>
      <select aria-label="主軸" onchange="location.hash=this.value">
        <option value="${set("theme", "")}">所有主軸</option>
        ${D.themes.map(t => `<option value="${set("theme", t.id)}" ${t.id === theme ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select></div>
    <p class="note">共 ${list.length} 支影片${sort === "hot" ? "・會員影片沒有公開觀看次數，排在最後" : ""}</p>
    ${list.length ? `<div class="grid">${list.map(x => card(x.v, q ? x.hits : null)).join("")}</div>`
      : `<div class="empty">找不到相關的直播，換個關鍵字試試看，例如個股名稱或「資產配置」。</div>`}
  </div>`;
}

function related(v, n) {
  if (!v.indexed) return D.videos.filter(x => x.id !== v.id).slice(0, n).map(x => ({ x, why: "" }));
  const mine = new Set(v.keywords), myT = new Set(v.topics);
  return D.videos.filter(x => x.id !== v.id && x.indexed && x.date !== v.date).map(x => {
    const shared = x.keywords.filter(k => mine.has(k));
    let s = shared.reduce((a, k) => a + IDF[k], 0) + 0.5 * x.topics.filter(k => myT.has(k)).reduce((a, k) => a + IDF[k], 0);
    shared.sort((a, b) => IDF[b] - IDF[a]);
    return { x, s, why: shared.length ? "也有講到：" + shared.slice(0, 3).join("、") : "" };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s).slice(0, n);
}

function watch(id) {
  $("#top").classList.remove("home-mode");
  const v = BYID[id];
  if (!v) { $("#app").innerHTML = `<div class="wrap empty">找不到這支影片。<a href="#/">回首頁</a></div>`; return; }
  const sib = D.videos.find(x => x.date === v.date && x.id !== v.id);
  const yt = `https://www.youtube.com/watch?v=${v.id}`;
  // 只顯示精華：長精華改稱「重點精華」，底下列出它的短精華／精精華標題；一般段落不顯示
  const blocks = []; let cur = null;
  for (const g of v.segs) {
    if (g.k === "長精華") { cur = { t: g.t, s: g.s, subs: [] }; blocks.push(cur); }
    else if (g.k !== "一般" && g.sub && cur) cur.subs.push(g.t);
    else if (g.k !== "一般") { blocks.push({ t: g.t, s: g.s, subs: [], plain: true }); }
    if (!g.sub && g.k !== "長精華") cur = null;
  }
  const segs = blocks.map(b => `<li><div class="st">${b.plain ? "" : `<span class="kind 長精華">重點精華</span>`}${esc(b.t)}</div><div class="ss">${esc(b.s)}</div>${b.subs.length ? `<ul class="subs">${b.subs.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</li>`).join("");
  const tags = v.topics.map(t => `<a class="tag" href="#/search?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join("")
    + v.keywords.slice(0, 18).map(t => `<a class="tag kw" href="#/search?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join("");
  const rel = related(v, 8);
  $("#app").innerHTML = `<div class="wrap"><div class="watch"><div>
    <div class="player"><iframe id="ytplayer" data-vid="${v.id}" src="https://www.youtube.com/embed/${v.id}?enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    ${v.member ? `<div class="memberbar">🔒 這是會員專屬直播，加入會員後才能觀看。<a class="btn m" href="https://www.youtube.com/@GoodWhale_tw/join" target="_blank" rel="noopener">加入會員</a><a class="btn ghost" href="${yt}" target="_blank" rel="noopener">到 YouTube 觀看</a></div>` : ""}
    <h1>${esc(v.title)}</h1>
    <div class="meta">${fmtDate(v.date)}・${v.member ? "會員直播" : "公開直播"}${v.views != null ? "・" + fmtViews(v.views) : ""}・<a href="${yt}" target="_blank" rel="noopener">在 YouTube 開啟</a></div>
    ${sib ? `<div class="box"><h2>同一場直播的${sib.member ? "會員段" : "公開段"}</h2>${mini(sib)}</div>` : ""}
    <div class="box"><h2>這集可以學到什麼</h2>${v.summary ? `<p style="margin:0 0 12px">${esc(v.summary)}</p>` : `<p class="note">這集還沒建立索引，目前只能用標題搜尋到。</p>`}
      ${segs ? `<ul class="segs">${segs}</ul>` : ""}</div>
    ${tags ? `<div class="box"><h2>標籤</h2>${tags}</div>` : ""}
  </div>
  <aside class="side"><h2>相關影片</h2>${rel.length ? rel.map(r => mini(r.x, r.why)).join("") : `<p class="note">還沒有其他相關影片。</p>`}</aside>
  </div></div>`;
  window.scrollTo(0, 0);
  trackPage("watch", "/watch/" + v.id, v.title);
  track("video_open", { video_id: v.id, video_title: v.title, video_type: v.member ? "會員" : "公開", video_date: v.date, click_source: nextSource || "直接進入" });
  nextSource = "";
  trackPlayer(v);
}

function route() {
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  if (path.startsWith("/watch/")) watch(decodeURIComponent(path.slice(7)));
  else if (path === "/search") results(new URLSearchParams(qs || ""));
  else home();
  if (!path.startsWith("/watch/")) window.scrollTo(0, 0);
}
init().catch(e => { $("#app").innerHTML = `<div class="wrap empty">資料載入失敗：${esc(e.message)}</div>`; });
</script>
</body>
</html>
