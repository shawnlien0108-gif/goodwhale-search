/* search page */

<script>
let D, ALIAS = [], IDF = {}, BYID = {};
const W = {"長精華": 1.5, "精精華": 1.3, "短精華": 1.2, "一般": 1};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const fmtViews = n => n == null ? "" : (n >= 10000 ? (n / 10000).toFixed(1) + " 萬" : n.toLocaleString()) + " 次觀看";
const fmtDate = d => d.replaceAll("-", "/");

/* ---------- 數據追蹤（GA4） ---------- */
function track(name, params) { try { if (window.gtag) gtag("event", name, params || {}); } catch (e) {} }
let curPage = "home", nextSource = "", lastSearch = null;
function trackPage(type, path, title) {
  curPage = type;
  const base = location.origin + location.pathname.replace(/\/$/, "");
  track("page_view", { page_location: base + path, page_title: title, page_type: type });
}
// 點擊追蹤：標籤、主軸、熱門關鍵字、影片卡片、行動呼籲按鈕
document.addEventListener("click", e => {
  const a = e.target.closest("a, button");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (a.classList.contains("tag")) track("tag_click", { tag_name: a.textContent.trim(), tag_type: a.classList.contains("kw") ? "關鍵字" : "主題標籤", page_type: curPage });
  else if (a.classList.contains("chip")) track("tag_click", { tag_name: a.textContent.trim(), tag_type: "熱門關鍵字", page_type: curPage });
  else if (href.includes("theme=")) { const id = new URLSearchParams(href.split("?")[1]).get("theme"); const th = D.themes.find(t => t.id === id); track("theme_click", { theme_name: th ? th.name : id }); }
  if (href.startsWith("#/watch/")) {
    const list = a.closest(".grid, aside, .box");
    const items = list ? [...list.querySelectorAll('a[href^="#/watch/"]')] : [];
    nextSource = a.closest("aside") ? "相關影片" : a.closest(".box") ? "同場另一段" : curPage === "search" ? "搜尋結果" : "首頁";
    if (a.closest("aside")) track("related_click", { video_id: href.slice(8), position: items.indexOf(a) + 1 });
  }
  if (/^https?:/.test(href)) {
    let cta = "其他外部連結";
    if (href.includes("/join")) cta = "加入會員";
    else if (href.includes("community.goodwhale.com")) cta = "Mighty 會員看回放";
    else if (href.includes("instagram.com/real.goodwhale")) cta = "IG 財鯨動向";
    else if (href.includes("instagram.com/j.perfectionist")) cta = "IG JohnJohn";
    else if (href.includes("instagram.com/maggy")) cta = "IG Maggy";
    else if (href.includes("instagram.com/adgar")) cta = "IG Adgar";
    else if (href.includes("watch?v=")) cta = a.textContent.includes("觀看") ? "到 YouTube 觀看（會員）" : "在 YouTube 開啟";
    else if (href.includes("youtube.com/@")) cta = "YouTube 頻道";
    const v = curPage === "watch" ? BYID[decodeURIComponent(location.hash.slice(8))] : null;
    // 按鈕位置：頁尾、會員提示列、播放區（會員影片封面）、影片資訊列
    const src = a.dataset.src || (a.closest("footer") ? "頁尾" : a.closest(".memberbar") ? "會員提示列" : curPage === "watch" ? "影片資訊列" : curPage);
    track("cta_click", { cta_name: cta, page_type: curPage, click_source: src, video_id: v ? v.id : "", video_type: v ? (v.member ? "會員" : "公開") : "" });
    // 會員影片：點去 YouTube 觀看，另外記一筆 member_video_click
    if (v && v.member && href.includes("watch?v=")) track("member_video_click", { video_id: v.id, video_title: v.title, video_date: v.date, video_type: "會員", click_source: src });
  }
});
// 內嵌影片播放追蹤（YouTube IFrame API）
let ytReady = null, ytTimer = null;
function loadYT() {
  if (!ytReady) ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  });
  return ytReady;
}
function trackPlayer(v) {
  clearInterval(ytTimer);
  loadYT().then(() => {
    const el = document.getElementById("ytplayer");
    if (!el || el.dataset.vid !== v.id) return;
    const base = { video_id: v.id, video_title: v.title, video_type: v.member ? "會員" : "公開" };
    let started = false, sent = new Set();
    const player = new YT.Player("ytplayer", { events: { onStateChange: ev => {
      if (ev.data === YT.PlayerState.PLAYING && !started) { started = true; track("yt_play", base); }
      if (ev.data === YT.PlayerState.ENDED && !sent.has(100)) { sent.add(100); track("yt_complete", base); }
    } } });
    ytTimer = setInterval(() => {
      try {
        const d = player.getDuration(), t = player.getCurrentTime();
        if (!d) return;
        for (const p of [25, 50, 75]) if (t / d * 100 >= p && !sent.has(p)) { sent.add(p); track("yt_progress", { ...base, percent: p }); }
      } catch (e) {}
    }, 5000);
  });
}

function go(form) {
  const q = form.q.value.trim();
  if (q) location.hash = "#/search?q=" + encodeURIComponent(q);
  return false;
}

async function init() {
  D = await fetch("data.json").then(r => r.json());
  D.videos.forEach(v => BYID[v.id] = v);
  for (const [name, al] of Object.entries(D.aliases)) ALIAS.push([name, [name, ...al].map(x => x.toLowerCase())]);
  const df = {};
  D.videos.forEach(v => new Set([...v.keywords, ...v.topics]).forEach(k => df[k] = (df[k] || 0) + 1));
  const n = D.videos.filter(v => v.indexed).length;
  for (const k in df) IDF[k] = Math.log(1 + n / df[k]);
  $("#updated").textContent = `資料更新：${D.updated}・每週四晚上 8 點直播・本站內容僅供參考，不構成投資建議・本站使用 Google Analytics 統計瀏覽情形`;
  window.addEventListener("hashchange", route);
  route();
}

/* ---------- 搜尋 ---------- */
function expand(term) {
  const t = term.toLowerCase(), set = new Set([term]);
  for (const [name, list] of ALIAS)
    if (list.some(a => a === t || (t.length >= 2 && a.includes(t)) || (a.length >= 2 && t.includes(a) && a.length >= t.length - 1))) set.add(name);
  return set;
}
function scoreTerm(v, raw, names) {
  const r = raw.toLowerCase(); let s = 0; const hits = [];
  if (v.title.toLowerCase().includes(r)) s += 8;
  if (v.summary.toLowerCase().includes(r)) s += 2;
  for (const g of v.segs) {
    let gs = 0;
    if (g.kw.some(k => names.has(k))) gs += 6;
    if (g.tp.some(k => names.has(k) || k.includes(raw))) gs += 4;
    if (g.t.toLowerCase().includes(r)) gs += 4;
    if (g.s.toLowerCase().includes(r)) gs += 1.5;
    if (gs) { s += gs * W[g.k]; hits.push(g.t); }
  }
  return { s, hits };
}
// 把「AI泡沫」這種沒空格的詞拆成 AI、泡沫；中文長詞再拆成兩字一組
function tokenize(raw) {
  const out = [];
  for (const m of raw.match(/[A-Za-z0-9.&+-]+|[^A-Za-z0-9.&+\-\s]+/g) || []) {
    if (/^[A-Za-z0-9.&+-]+$/.test(m) || m.length <= 2) out.push(m);
    else for (let i = 0; i < m.length - 1; i++) out.push(m.slice(i, i + 2));
  }
  return [...new Set(out)];
}
function scoreVideo(v, terms) {
  let total = 0; const hits = new Set();
  for (const { raw, names, toks } of terms) {
    let { s, hits: h } = scoreTerm(v, raw, names);
    if (!s && toks.length > 1) {
      let got = 0, sum = 0; const hh = [];
      for (const t of toks) { const r = scoreTerm(v, t, expand(t)); if (r.s) { got++; sum += r.s; hh.push(...r.hits); } }
      if (got >= Math.ceil(toks.length / 2)) { s = sum * (got / toks.length) ** 2 * 0.8; h = hh; }
    }
    if (!s) return null;
    h.forEach(x => hits.add(x)); total += s;
  }
  return { v, score: total, hits: [...hits] };
}
function search(q) {
  const terms = q.split(/\s+/).filter(Boolean).map(raw => ({ raw, names: expand(raw), toks: tokenize(raw) }));
  return D.videos.map(v => scoreVideo(v, terms)).filter(Boolean);
}
function themeScore(v, th) {
  return v.segs.reduce((s, g) => s + (g.tp.some(t => th.topics.includes(t)) ? W[g.k] * (g.k === "一般" ? 1 : 2) : 0), 0);
}

function topKeywords(n) {

}

      for (const k in o.kw || {}) W2.kw[k] = (W2.kw[k] || 0) + o.kw[k] * f;
      for (const k in o.txt || {}) W2.txt[k] = (W2.txt[k] || 0) + o.txt[k] * f;
      if (o.fresh != null) W2.fresh = o.fresh;

  const rows = D.videos.filter(v => v.segs.length).map(v => {
    let m = 0; const hit = {};
    for (const s of v.segs) {
      for (const t of s.tp) if (w.tp[t]) { m += w.tp[t]; hit[t] = (hit[t] || 0) + w.tp[t]; }
      for (const k in w.kw) { const x = s.kw.find(z => z.includes(k)); if (x) { m += w.kw[k]; hit[x] = (hit[x] || 0) + w.kw[k]; } }
      for (const k in w.txt) if ((s.t + s.s).includes(k)) m += w.txt[k];
    }
    m /= v.segs.length;
    const days = (today - new Date(v.date)) / 864e5;
    const pop = v.member ? .3 : (v.views || 0) / maxv;
    const score = m * (1 - w.fresh - .1) + w.fresh * Math.exp(-days / 150) * 2 + .2 * pop;
    const why = Object.keys(hit).sort((a, b) => hit[b] - hit[a]).slice(0, 3);
    return { v, score, why };
  }).sort((a, b) => b.score - a.score);
  const nm = ans.member === "是" ? 3 : 1, np = 6 - nm, out = [], dates = new Set();
  let cp = 0, cm = 0;
  for (const r of rows) {
    if (dates.has(r.v.date)) continue; // 同一集直播只推一支
    if (r.v.member ? cm >= nm : cp >= np) continue;
    r.v.member ? cm++ : cp++;
    dates.add(r.v.date); out.push(r);
    if (out.length === 6) break;
  }
  return out.sort((a, b) => a.v.member - b.v.member);
}

function openQuiz(src) {
  QZ = { step: -1, ans: {}, src: src || "直接連結", list: null, unlocked: false };
  track("quiz_open", { click_source: QZ.src });
  document.body.style.overflow = "hidden";
  renderQuiz();
}
function closeQuiz() {
  if (QZ && !QZ.list) track("quiz_close", { step: QZ.step + 1 });
  QZ = null; $("#quiz").innerHTML = ""; document.body.style.overflow = "";
  if (location.hash === "#/quiz") history.replaceState(null, "", "#/");
}
function quizPick(i) {
  const Q = QUIZ[QZ.step], key = Object.keys(Q.opts)[i];
  if (!Q.multi) { QZ.ans[Q.id] = key; return quizNext(); }
  let sel = QZ.ans[Q.id] || [];
  if (Q.opts[key].only) sel = sel.includes(key) ? [] : [key];
  else {
    sel = sel.filter(x => !Q.opts[x].only);
    if (sel.includes(key)) sel = sel.filter(x => x !== key);
    else if (sel.length < Q.multi) sel = [...sel, key];
  }
  QZ.ans[Q.id] = sel; renderQuiz();
}
function quizNext() {
  if (QZ.step === -1) track("quiz_start", { click_source: QZ.src });
  QZ.step++;
  if (QZ.step >= QUIZ.length) {
    QZ.list = quizPlaylist(QZ.ans);
    QZ.unlocked = !QUIZ_CFG.EMAIL_GATE;
    const p = { click_source: QZ.src };
    for (const Q of QUIZ) p["q_" + Q.id] = [].concat(QZ.ans[Q.id]).join("、");
    track("quiz_complete", p);
  }
  renderQuiz();
}
function quizBack() { QZ.step--; renderQuiz(); }
async function quizEmail(form) {
  const email = form.email.value.trim(), err = form.querySelector(".qz-err");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Email 格式好像不太對，再檢查一下"; return false; }
  form.querySelector("button").disabled = true;
  if (QUIZ_CFG.MAILERLITE_URL) {
    // 之後串 MailerLite：把 Email、答案、片單影片 ID 一起送出
    const fd = new FormData();
    fd.append("fields[email]", email);
    for (const Q of QUIZ) fd.append(`fields[quiz_${Q.id}]`, [].concat(QZ.ans[Q.id]).join("、"));
    fd.append("fields[quiz_playlist]", QZ.list.map(r => r.v.id).join(","));
    try { await fetch(QUIZ_CFG.MAILERLITE_URL, { method: "POST", body: fd, mode: "no-cors" }); } catch (e) {}
  }
  track("quiz_email_submit", { click_source: QZ.src, connected: QUIZ_CFG.MAILERLITE_URL ? "是" : "否（預覽版）" });
  QZ.unlocked = true; QZ.sent = true; renderQuiz();
  return false;
}
function renderQuiz() {
  if (!QZ) return;
  const total = QUIZ.length, s = QZ.step;
  let head = "", body = "";
  if (s === -1) {
    body = `<div class="qz-intro"><div class="big">🎯</div><h2>想要財鯨動向幫你打造專屬直播片單嗎？</h2>
      <p>回答 ${total} 個小問題，我們從 ${D.videos.length} 支直播裡，挑出最適合你的 6 支。</p>
      <button class="qz-btn" onclick="quizNext()">開始測驗</button></div>`;
  } else if (s < total) {
    const Q = QUIZ[s], keys = Object.keys(Q.opts), sel = [].concat(QZ.ans[Q.id] || []);
    head = `<div class="qz-step">第 ${s + 1} 題 / 共 ${total} 題</div><div class="qz-bar"><i style="width:${(s + 1) / total * 100}%"></i></div>`;
    body = `<h2>${esc(Q.q)}</h2>${Q.hint ? `<p class="hint">${esc(Q.hint)}</p>` : `<p class="hint">選一個最接近的</p>`}
      <div class="qz-opts ${keys.length > 5 ? "two" : ""}">${keys.map((k, i) => `<button class="qz-opt ${sel.includes(k) ? "on" : ""}" onclick="quizPick(${i})">${esc(k)}</button>`).join("")}</div>
      <div class="qz-nav"><button class="qz-link" onclick="${s ? "quizBack()" : "QZ.step=-1;renderQuiz()"}">← 上一題</button>
      ${Q.multi ? `<button class="qz-btn" onclick="quizNext()" ${sel.length ? "" : "disabled"}>下一題</button>` : ""}</div>`;
  } else {
    const gate = QZ.unlocked ? QZ.list.length : QUIZ_CFG.EMAIL_GATE;
    const item = r => mini(r.v, r.why.length ? "因為你關注：" + r.why.join("、") : "");
    const mail = `<div class="qz-mail">${QZ.sent
        ? `<p class="qz-ok">✓ 已收到！${QUIZ_CFG.MAILERLITE_URL ? "片單會寄到你的信箱，之後每週也會推薦新直播給你。" : "（預覽版：Email 還沒串接，這次不會真的寄出）"}</p>`
        : `<h3>${QZ.unlocked ? "把這份片單寄給自己" : `留下 Email，解鎖另外 ${QZ.list.length - gate} 支`}</h3>
        <p>我們會把片單寄給你，之後每週直播也會依你的興趣推薦新的一集。</p>
        <form onsubmit="return quizEmail(this)"><input name="email" type="email" placeholder="你的 Email" required autocomplete="email"><button class="qz-btn">寄給我</button></form>
        <div class="qz-err"></div>
        <small>Email 僅用於寄送片單與財鯨電子報，可隨時取消訂閱。</small>`}</div>`;
    body = `<h2>你的專屬直播片單</h2><p class="hint">依你的回答，從所有直播挑出這 ${QZ.list.length} 支${QZ.ans.member === "是" ? "，會員影片請到 YouTube 觀看" : ""}</p>
      <div class="qz-list">${QZ.list.slice(0, gate).map(item).join("")}</div>
      ${QZ.unlocked ? mail : mail + `<div class="qz-list">${QZ.list.slice(gate).map(r => `<div class="qz-lock">${item(r)}</div>`).join("")}</div>`}
      <div class="qz-foot"><button class="qz-link" onclick="openQuiz('重新測驗')">↺ 重新測驗</button>
        ${QZ.ans.member === "是" ? "" : `<a class="btn m" href="https://www.youtube.com/@GoodWhale_tw/join" target="_blank" rel="noopener" data-src="測驗結果">加入會員看完整直播</a>`}</div>`;
  }
  $("#quiz").innerHTML = `<div class="qz-back" onclick="if(event.target===this)closeQuiz()"><div class="qz" role="dialog" aria-modal="true" aria-label="專屬片單測驗">
    <button class="qz-x" onclick="closeQuiz()" aria-label="關閉">×</button>
    ${head ? `<div class="qz-head">${head}</div>` : `<div style="height:36px"></div>`}<div class="qz-body">${body}</div></div></div>`;
  $(".qz").scrollTop = 0;
}
// 點測驗結果裡的影片：記一筆 quiz_video_click，並關掉視窗去影片頁
document.addEventListener("click", e => {
  const a = e.target.closest(".qz-list a.mini");
  if (!a || !QZ) return;
  const id = a.getAttribute("href").slice(8), i = QZ.list.findIndex(r => r.v.id === id);
  track("quiz_video_click", { video_id: id, position: i + 1, video_type: BYID[id]?.member ? "會員" : "公開" });
  nextSource = "專屬片單";
  QZ = null; $("#quiz").innerHTML = ""; document.body.style.overflow = "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && QZ) closeQuiz(); });

function route() {
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  if (path === "/quiz") { home(); if (!QZ) openQuiz(new URLSearchParams(qs || "").get("src") || "直接連結"); return; }
  if (path.startsWith("/watch/")) watch(decodeURIComponent(path.slice(7)));
  else if (path === "/search") results(new URLSearchParams(qs || ""));
  else home();
  if (!path.startsWith("/watch/")) window.scrollTo(0, 0);
}
init().catch(e => { $("#app").innerHTML = `<div class="wrap empty">資料載入失敗：${esc(e.message)}</div>`; });
</script>
